name: Edge Report

on:
  # Run automatically on NFL game days at 11 AM ET (16:00 UTC)
  # Thursday, Sunday, Monday during NFL season (Sep–Feb)
  schedule:
    - cron: "0 16 * 9-12 0"  # Sundays Sep–Dec
    - cron: "0 16 * 1-2 0"   # Sundays Jan–Feb
    - cron: "0 16 * 9-12 1"  # Mondays Sep–Dec
    - cron: "0 16 * 1-2 1"   # Mondays Jan–Feb
    - cron: "0 16 * 9-12 4"  # Thursdays Sep–Dec
    - cron: "0 16 * 1-2 4"   # Thursdays Jan–Feb

  # Run manually from the Actions tab — pick any date/sports
  workflow_dispatch:
    inputs:
      date:
        description: "Game date (YYYY-MM-DD, default: today)"
        required: false
        default: ""
      sports:
        description: "Comma-separated sports"
        required: false
        default: "nfl"
      ev_only:
        description: "Show +EV rows only"
        type: boolean
        required: false
        default: false
      min_edge:
        description: "Minimum edge % to show (e.g. 3 for 3%)"
        required: false
        default: "0"

jobs:
  edge-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit ratings.json back to repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore Elo ratings committed by previous runs
      - name: Ensure storage dir
        run: mkdir -p storage

      - name: Determine date
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

          if [ -n "${{ github.event.inputs.sports }}" ]; then
            echo "sports=${{ github.event.inputs.sports }}" >> $GITHUB_OUTPUT
          else
            echo "sports=nfl" >> $GITHUB_OUTPUT
          fi

          ev_flag=""
          if [ "${{ github.event.inputs.ev_only }}" = "true" ]; then
            ev_flag="--ev-only"
          fi
          echo "ev_flag=$ev_flag" >> $GITHUB_OUTPUT

          min_edge="${{ github.event.inputs.min_edge }}"
          min_edge="${min_edge:-0}"
          echo "min_edge=$min_edge" >> $GITHUB_OUTPUT

      - name: Update Elo from yesterday's results
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: |
          python main.py update-elo 2>&1 | tail -5 || true

      - name: Run edge report
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: |
          DATE="${{ steps.vars.outputs.date }}"
          SPORTS="${{ steps.vars.outputs.sports }}"
          EV_FLAG="${{ steps.vars.outputs.ev_flag }}"
          MIN_EDGE="${{ steps.vars.outputs.min_edge }}"

          echo "================================================"
          echo "  8rain Station® Edge Report"
          echo "  Date:   $DATE"
          echo "  Sports: $SPORTS"
          echo "================================================"

          python main.py edge \
            --date "$DATE" \
            --sports "$SPORTS" \
            $EV_FLAG \
            ${MIN_EDGE:+--min-edge $(echo "scale=4; $MIN_EDGE/100" | bc)} \
            2>&1

      - name: Save output CSVs
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: |
          python main.py run \
            --date "${{ steps.vars.outputs.date }}" \
            --sports "${{ steps.vars.outputs.sports }}" \
            2>&1 | tail -10

      - name: Upload CSVs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ steps.vars.outputs.date }}
          path: output/*.csv
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit updated Elo ratings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/ratings.json || true
          git diff --cached --quiet || git commit -m "chore: update Elo ratings [$(date -u +%Y-%m-%d)]"
          git push || true
